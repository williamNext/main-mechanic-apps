name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      mechanic: ${{ steps.filter.outputs.mechanic }}
      oficina: ${{ steps.filter.outputs.oficina }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            mechanic:
              - 'mechanic/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitattributes'
            oficina:
              - 'oficina/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitattributes'
            admin:
              - 'admin/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitattributes'

  server-typecheck:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run build

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm test

  mechanic-checks:
    needs: changes
    if: needs.changes.outputs.mechanic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run -w mechanic typecheck
      - name: Lint
        run: npm run -w mechanic lint
      - name: Native bundle
        run: npm exec -w mechanic -- expo export --platform ios

  admin-checks:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run -w admin typecheck
      - name: Lint
        run: npm run -w admin lint
      - name: Native bundle
        run: npm exec -w admin -- expo export --platform ios

  oficina-checks:
    needs: changes
    if: needs.changes.outputs.oficina == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run -w oficina typecheck
      - name: Lint
        run: npm run -w oficina lint
      - name: Native bundle
        run: npm exec -w oficina -- expo export --platform ios
